[package]
name = "causet-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The Git engine the ported commands share (issue #143, ADR-0037): the read
# catalog of ADR-0019 behind one backend trait, the object and merge-tree
# sessions of ADR-0009 and ADR-0016, and explicit mutations. `src/git.js` and
# `src/engine.js` stay the authority; `test/rust-engine.test.js` runs both
# against the same repositories.

[dependencies]
causet-core = { path = "../core" }
causet-model = { path = "../model" }

[[bin]]
name = "engine-probe"
path = "src/bin/engine-probe.rs"

[[bin]]
name = "fuzz-engine"
path = "src/bin/fuzz-engine.rs"
