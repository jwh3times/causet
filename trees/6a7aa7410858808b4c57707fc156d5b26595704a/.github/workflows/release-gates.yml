name: release gates

# The release gates that are not the suite or the package set, run where a
# release can be audited: on GitHub-hosted runners, never on a maintainer's
# machine (docs/testing.md, "Release gate").
#
#   gate 4   every maintained demo completes
#   gate 5   metadata validation of this repository reports no errors
#   gate 10  the deterministic benchmark check passes
#
# Dispatch it on the release commit. It also runs for a pull request that
# touches the benchmark, its baseline, or this file.
#
# The benchmark compares process, record and materialization counts with the
# committed baseline entry recorded on the same kind of runner
# (`github-<runner label>`). Those counts are properties of the code. Latency
# is not compared here: it cannot travel between machines, and a shared runner
# cannot measure it. A runner with no entry yet records one and uploads it, for
# a person to review and commit.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-gates.yml"
      - "benchmarks/**"
      - "scripts/benchmark-regression.mjs"
      - "scripts/benchmark-host.mjs"

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: gates / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the causal refs metadata validation reads
        # A checkout brings branches and tags, not notes or refs/causet/*.
        run: git fetch --no-tags origin '+refs/notes/causet:refs/notes/causet' '+refs/causet/*:refs/causet/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the cst a release ships
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          node scripts/build-native.mjs
          executable="$PWD/native/target/release/cst"
          if [ "${{ runner.os }}" = "Windows" ]; then executable="$(cygpath -w "$executable.exe")"; fi
          "$executable" --version
          echo "CAUSET_CLI=$executable" >> "$GITHUB_ENV"
          echo "CAUSET_DELEGATE=never" >> "$GITHUB_ENV"
      - name: Gate 4, every maintained demo completes
        run: |
          for demo in demo demo:conflict demo:resolution demo:forecast demo:spec demo:git-session; do
            echo "::group::npm run $demo"
            npm run "$demo"
            echo "::endgroup::"
          done
          npm run demo:clean -- --apply
      - name: Gate 5, this repository's metadata validates
        run: |
          "$CAUSET_CLI" metadata validate --json > validation.json
          node -e '
            const { summary } = JSON.parse(require("fs").readFileSync("validation.json", "utf8"));
            console.log(JSON.stringify(summary));
            if (summary.errors !== 0) process.exit(1);
          '
      - name: Gate 10, the deterministic benchmark check
        run: |
          label="github-${{ matrix.os }}"
          if node -e 'process.exit(require("./benchmarks/baseline.json").hosts?.[process.argv[1]] ? 0 : 1)' "$label"; then
            npm run test:benchmark
          else
            echo "::warning::benchmarks/baseline.json has no entry for $label. Recording one; review and commit the uploaded baseline, then run this again."
            npm run benchmark:record -- --host "$label"
            echo "RECORDED_BASELINE=1" >> "$GITHUB_ENV"
          fi
      - name: Keep a newly recorded baseline entry
        if: env.RECORDED_BASELINE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}
          path: benchmarks/baseline.json
          if-no-files-found: error
      - name: A runner without a baseline entry has not passed gate 10
        if: env.RECORDED_BASELINE == '1' && github.event_name == 'workflow_dispatch'
        run: |
          echo "This runner recorded a baseline entry instead of checking against one." >&2
          exit 1
