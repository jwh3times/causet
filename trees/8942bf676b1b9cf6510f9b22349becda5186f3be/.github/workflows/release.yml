name: release

# Builds the package set of ADR-0038 and installs it the way a user does.
#
# - A pull request that touches the packaging, and a manual dispatch, are dry
#   runs: build, assemble, and smoke-test on each platform's runner.
# - A `v*` tag also attests the archives and the install scripts, drafts a
#   GitHub release with them, the npm tarballs and SHA256SUMS, and publishes
#   to npm when the repository variable
#   NPM_PUBLISH is `true`. Each package's first publish is manual, from this
#   run's artifacts, because npm configures a trusted publisher only on a
#   package that exists (issue #139).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "bin/native/**"
      - "scripts/pack-release.mjs"
      - "scripts/build-native.mjs"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "test/release-packaging.test.js"
      - "test/install-script.test.js"
      - "test-support/installed-smoke.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            executable: cst
            prebuild: linux-x64
          - os: windows-latest
            platform: win32-x64
            target: x86_64-pc-windows-msvc
            executable: cst.exe
            prebuild: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the executable from the pinned toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          node scripts/build-native.mjs
      - name: Stage the executable, its notices and its archive
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p staged
          cp "native/target/release/${{ matrix.executable }}" staged/
          cp "native/prebuilds/${{ matrix.prebuild }}/THIRD-PARTY-NOTICES.txt" staged/
          cp LICENSE staged/
          "staged/${{ matrix.executable }}" --version
          test "$("staged/${{ matrix.executable }}" --version)" = "causet $version"
          archive="cst-$version-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd staged && 7z a -tzip "../$archive.zip" "${{ matrix.executable }}" THIRD-PARTY-NOTICES.txt LICENSE)
          else
            tar -C staged -czf "$archive.tar.gz" "${{ matrix.executable }}" THIRD-PARTY-NOTICES.txt LICENSE
          fi
          mkdir -p upload/archives
          mv staged "upload/${{ matrix.platform }}"
          mv "$archive".* upload/archives/
      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.platform }}
          path: upload/
          if-no-files-found: error

  package:
    name: assemble the package set
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: executable-*
          path: executables
          merge-multiple: true
      - name: The tag names the version being released
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Pack every package
        id: pack
        run: |
          node scripts/pack-release.mjs --out dist \
            --executable linux-x64-gnu=executables/linux-x64-gnu/cst \
            --notices linux-x64-gnu=executables/linux-x64-gnu/THIRD-PARTY-NOTICES.txt \
            --executable win32-x64=executables/win32-x64/cst.exe \
            --notices win32-x64=executables/win32-x64/THIRD-PARTY-NOTICES.txt
          cp executables/archives/* dist/
          # The install scripts travel with the release they install (ADR-0038, 2026-10-08).
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum cst-* install.sh install.ps1 >> SHA256SUMS && cat SHA256SUMS)
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-set
          path: dist/
          if-no-files-found: error

  smoke:
    name: install and smoke-test / ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: dist
      - name: Install by npm and by script, and run each installed command
        shell: bash
        run: |
          git --version
          node --version
          npm --version
          CAUSET_RELEASE_SET=dist node --test test/release-packaging.test.js test/install-script.test.js 2>&1 | tee smoke.log
      - name: Nothing was skipped
        shell: bash
        run: |
          if grep -E '^(ℹ|#) skipped [1-9]' smoke.log; then
            echo "The packaging tests skipped themselves on a release runner." >&2
            exit 1
          fi

  publish:
    name: attest and draft the release, and publish to npm when enabled
    if: github.event_name == 'push'
    needs: [package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Trusted publishing and attestation: this run's OIDC token is exchanged
      # for a short-lived credential, so no npm token is stored anywhere.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: dist
      - name: Attest what a user downloads
        # `gh attestation verify <file> --repo jwh3times/causet` checks these.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/cst-*
            dist/install.sh
            dist/install.ps1
      - name: Draft the GitHub release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "causet ${GITHUB_REF_NAME}" \
            --notes "Assets of ${GITHUB_REF_NAME}: one archive per platform, the npm tarballs, and SHA256SUMS. See CHANGELOG.md." \
            dist/*
      - name: Publish to npm with provenance
        if: vars.NPM_PUBLISH == 'true'
        run: |
          npm install --global npm@latest
          npm --version
          # Platform packages first, so the main package never names one that is not there.
          for tarball in $(ls dist/holland-vip-causet-*.tgz | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-); do
            npm publish "$tarball" --provenance --access public
          done
