[package]
name = "causet-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "cst"
path = "src/main.rs"

[dependencies]
causet-engine = { path = "../engine" }
causet-model = { path = "../model" }
# Already in the workspace through gix; `slug` normalizes titles with NFKD as
# String.prototype.normalize does.
unicode-normalization = "=0.1.25"
# Already in the workspace through gix; `cst spec benchmark` estimates
# compressed sizes with it.
zlib-rs = "=0.6.7"
