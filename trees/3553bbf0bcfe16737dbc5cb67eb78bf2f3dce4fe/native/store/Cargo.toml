[package]
name = "causet-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The native content store of N1 (ADR-0045, #297), built to the contract in
# `docs/native-store/`, which stays the authority: its worked examples and
# reference vectors are what this crate's tests check. It reads no Git
# repository, so it depends on neither `causet-core`, `causet-engine` nor
# gitoxide.

[dependencies]
# SHA-256, the native ID's digest (objects.md §1.1).
causet-model = { path = "../model" }
# The frame codec (storage.md §3), through zstd's C library, which ADR-0045
# decision 7 chose: the storage gate is out of reach without zstd's grouped
# frames and deltas. Pinned exactly, because a store is byte-identical only
# within one libzstd (storage.md §7). Default features off: they add the
# legacy formats and the dictionary builder, which the store never uses.
zstd = { version = "=0.14.3", default-features = false }
# libzstd itself, which the crate above compiles from its bundled sources:
# 1.5.7. Named here only to pin it, since frames are byte-identical only within
# one libzstd.
zstd-sys = { version = "=2.1.2", default-features = false }
