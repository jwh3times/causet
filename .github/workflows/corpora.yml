name: corpora

# The heavy corpora of ADR-0044 (item 7), on GitHub-hosted Windows and Ubuntu
# runners (ADR-0045 decision 13):
#
# - the generated-history corpus (#308): 1,000 histories from one seed, each
#   through every N1 check (equality, the reconstruction check, and both
#   import checks; docs/testing.md, "The generated-history corpus");
# - the real repositories (#309): causet's own history, git/git and the
#   large-file corpus, each through the same checks, with zero Git processes
#   in native reads and the storage gate against `git gc --aggressive`
#   (docs/testing.md, "The real repositories"). Each job's summary reports
#   both byte counts.
#
# It runs weekly on main, on manual dispatch, from release-gates.yml when a
# release is qualified (release gate 11), and for a pull request that changes
# the corpus or this file. Timings are reported by the runner, never checked.

on:
  workflow_dispatch:
    inputs:
      histories:
        description: Histories to generate and check (at least 1,000 for the gate)
        default: "1000"
      seed:
        description: The corpus seed
        default: causet-n1
  workflow_call:
  pull_request:
    paths:
      - "test-support/generated-histories.js"
      - "test-support/generated-history-check.js"
      - "test/generated-histories.test.js"
      - "test-support/import-checks.js"
      - "test-support/real-repositories.js"
      - "test-support/real-repository-check.js"
      - "test/real-repositories.test.js"
      - ".github/workflows/corpora.yml"
  schedule:
    # Weekly on main, after perf.yml's run.
    - cron: "41 7 * * 1"

permissions:
  contents: read

concurrency:
  group: corpora-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  generated:
    name: generated histories / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # About twice the slowest run measured (Windows, 44 minutes for 1,000
    # histories on #333); a process that hangs is stopped after 5 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CAUSET_GENERATED_HISTORIES: ${{ inputs.histories || '1000' }}
      CAUSET_GENERATED_SEED: ${{ inputs.seed || 'causet-n1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain
        run: |
          git --version
          node --version
      - name: Build the cst under test
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          node scripts/build-native.mjs
      - name: Generate and check the corpus
        run: node --test test/generated-histories.test.js

  real:
    name: real repository ${{ matrix.repository }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # git/git imports in about 9 minutes on a 16-core Linux host and is
    # imported three times; each import's time is in the job's summary.
    timeout-minutes: ${{ matrix.repository == 'git' && 300 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repository: [causet, git, large-files]
    env:
      CAUSET_REAL_REPOSITORIES: ${{ matrix.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The causet corpus is this repository's whole history and tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain
        run: |
          git --version
          node --version
      - name: Build the cst under test
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          node scripts/build-native.mjs
      - name: Cache the Node.js release archives
        if: matrix.repository == 'large-files'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/large-file-cache
          key: large-file-cache-${{ hashFiles('test-support/real-repositories.js') }}
          restore-keys: large-file-cache-
      - name: Import and check the repository
        env:
          CAUSET_LARGE_FILE_CACHE: ${{ runner.temp }}/large-file-cache
        run: node --test test/real-repositories.test.js
